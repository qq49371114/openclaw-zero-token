name: 🚀 龙虾打包机 - 一键生成免安装桌面版
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安装依赖并编译
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
          pnpm ui:build

      - name: 🏗️ 制作绿色版全家桶
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path "OpenClaw-Portable"
          if (Test-Path "dist") { Copy-Item -Path "dist" -Destination "$out/" -Recurse -Force }
          if (Test-Path "ui/dist") { 
            $uiOut = New-Item -ItemType Directory -Force -Path "$out/ui"
            Copy-Item -Path "ui/dist" -Destination "$uiOut/" -Recurse -Force 
          }
          if (Test-Path "openclaw.mjs") { Copy-Item "openclaw.mjs" -Destination "$out/" -Force }
          if (Test-Path "package.json") { Copy-Item "package.json" -Destination "$out/" -Force }
          if (Test-Path ".openclaw-state.example") { Copy-Item -Path ".openclaw-state.example" -Destination "$out/" -Recurse -Force }
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "$out/node.exe" -Force
          
      - name: 📝 写入一键启动脚本
        shell: pwsh
        run: |
          $script = @"
          @echo off
          title OpenClaw Zero Token - Portable
          echo 正在启动免 Token 小龙虾...
          .
ode.exe openclaw.mjs server start
          pause
          "@
          $script | Out-File -FilePath "OpenClaw-Portable\双击我启动.bat" -Encoding ascii

      - name: 🎁 发布成品
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Zero-Token-绿色免安装版
          path: OpenClaw-Portable/
