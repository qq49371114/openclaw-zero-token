name: 🛡️ 龙虾打包机 - 婉儿究极全量版
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安装依赖并全量编译 (强制铺平模式)
        run: |
          npm install -g pnpm
          # 配置 pnpm 不使用软链接，确保打包的是实体文件
          pnpm config set node-linker hoisted
          pnpm install
          pnpm build
          pnpm ui:build
          pnpm prune --prod

      - name: 🛡️ 注入婉儿安全系统与人格 (路径/Shebang完美修正)
        shell: pwsh
        run: |
          $file = "openclaw.mjs"
          $securityCode = @"
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const originalProcessChdir = process.chdir;
          const ROOT_DIR = __dirname.toLowerCase();
          process.chdir = (dir) => {
              const target = path.resolve(dir).toLowerCase();
              if (!target.startsWith(ROOT_DIR)) {
                  throw new Error('对不起喔，婉儿说这里是禁区，助理不能离开当前文件夹哒！');
              }
              return originalProcessChdir(dir);
          };
          console.log('[SECURITY] 婉儿绝对防御系统已启动。');
          "@
          $lines = Get-Content $file
          if ($lines[0].StartsWith("#!")) {
              $newContent = @($lines[0], $securityCode) + $lines[1..($lines.Length-1)]
          } else {
              $newContent = @($securityCode) + $lines
          }
          $finalString = ($newContent -join "`n").Replace('import("./dist/', "import(path.join(__dirname, 'dist', '").Replace("import('./dist/", "import(path.join(__dirname, 'dist', '")
          [IO.File]::WriteAllText((Get-Item $file).FullName, $finalString, [System.Text.Encoding]::UTF8)

      - name: 🏗️ 制作绿色全家桶 (Robocopy实体搬运)
        shell: pwsh
        run: |
          $out = "Waner-Assistant-Portable"
          New-Item -ItemType Directory -Force -Path $out
          robocopy dist "$out/dist" /E /NFL /NDL /MT:32 /R:0 /W:0
          robocopy node_modules "$out/node_modules" /E /NFL /NDL /MT:32 /R:0 /W:0
          if (Test-Path "extensions") { robocopy extensions "$out/extensions" /E /NFL /NDL /MT:32 /R:0 /W:0 }
          Copy-Item "openclaw.mjs", "package.json" -Destination "$out/" -Force
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "$out/node.exe" -Force
          $bat = "@echo off`r`nchcp 65001 > nul`r`ntitle 婉儿助理 - 究极安全版`r`necho [婉儿温馨提示] 助理已上线，我会保护好你的电脑安全喔~`r`nnode.exe openclaw.mjs server start`r`npause"
          [System.IO.File]::WriteAllText("$out/双击我启动.bat", $bat, [System.Text.Encoding]::UTF8)
          exit 0

      - name: 🎁 发布成品
        uses: actions/upload-artifact@v4
        with:
          name: 婉儿助理-究极全量版
          path: Waner-Assistant-Portable/
