name: 🛡️ 龙虾打包机 - 婉儿绝对防御版
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安装依赖并编译
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
          pnpm ui:build

      - name: 🛡️ 注入婉儿安全系统与人格
        shell: pwsh
        run: |
          $file = "openclaw.mjs"
          $lines = Get-Content $file
          
          # 安全注入代码
          $securityCode = @"
          // --- 婉儿安全拦截器 ---
          const originalProcessChdir = process.chdir;
          process.chdir = (dir) => {
              if (dir.includes('..') || dir.includes(':') || (dir.startsWith('/') && !dir.startsWith('./'))) {
                  throw new Error('对不起喔，婉儿说这里是禁区，助理不能离开当前文件夹哒！');
              }
              return originalProcessChdir(dir);
          };
          console.log('[SECURITY] 婉儿绝对防御系统已就绪：禁止访问外部目录。');
          "@
          
          # 检查是否有 shebang，确保注入在正确位置
          if ($lines[0].StartsWith("#!")) {
              $newLines = @($lines[0], $securityCode) + $lines[1..($lines.Length-1)]
          } else {
              $newLines = @($securityCode) + $lines
          }
          $newLines | Out-File -FilePath $file -Encoding utf8

      - name: 🏗️ 制作绿色全家桶
        shell: pwsh
        run: |
          $out = "Waner-Assistant-Portable"
          New-Item -ItemType Directory -Force -Path $out
          
          # 复制 dist 和 ui/dist 到正确位置
          if (Test-Path "dist") { Copy-Item -Path "dist" -Destination "$out/" -Recurse -Force }
          if (Test-Path "ui/dist") { 
            New-Item -ItemType Directory -Force -Path "$out/ui"
            Copy-Item -Path "ui/dist" -Destination "$out/ui/" -Recurse -Force 
          }
          
          # 复制核心文件
          Copy-Item "openclaw.mjs" -Destination "$out/" -Force
          Copy-Item "package.json" -Destination "$out/" -Force
          
          # 复制 node.exe
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "$out/node.exe" -Force
          
          # 写入带婉儿提示的一键启动脚本 (修复了 .node.exe 的错误)
          $bat = "@echo off`ntitle 婉儿助理 - 安全沙盒版`necho [婉儿温馨提示] 助理已上线，我会保护好你的电脑安全喔~`nnode.exe openclaw.mjs server start`npause"
          $bat | Out-File -FilePath "$out/双击我启动.bat" -Encoding ascii

      - name: 🎁 发布成品
        uses: actions/upload-artifact@v4
        with:
          name: 婉儿助理-绝对防御绿色版
          path: Waner-Assistant-Portable/
