name: 🛡️ 龙虾打包机 - 婉儿绝对防御版
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安装依赖并编译
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
          pnpm ui:build

      - name: 🛡️ 注入婉儿安全系统与人格
        shell: pwsh
        run: |
          $file = "openclaw.mjs"
          $lines = Get-Content $file
          
          # 改进的安全拦截器：支持 Windows 路径，仅限制跨出根目录的操作
          $securityCode = @"
          // --- 婉儿安全拦截器 ---
          import path from 'node:path';
          const originalProcessChdir = process.chdir;
          const ROOT_DIR = process.cwd();
          process.chdir = (dir) => {
              const target = path.resolve(dir);
              if (!target.startsWith(ROOT_DIR)) {
                  throw new Error('对不起喔，婉儿说这里是禁区，助理不能离开当前文件夹哒！');
              }
              return originalProcessChdir(dir);
          };
          console.log('[SECURITY] 婉儿绝对防御系统已就绪。');
          "@
          
          if ($lines[0].StartsWith("#!")) {
              $newLines = @($lines[0], $securityCode) + $lines[1..($lines.Length-1)]
          } else {
              $newLines = @($securityCode) + $lines
          }
          [IO.File]::WriteAllLines((Get-Item $file).FullName, $newLines)

      - name: 🏗️ 制作绿色全家桶
        shell: pwsh
        run: |
          $out = "Waner-Assistant-Portable"
          New-Item -ItemType Directory -Force -Path $out
          
          # 显式复制 dist 文件夹及其内容
          if (Test-Path "dist") {
              $targetDist = New-Item -ItemType Directory -Force -Path "$out/dist"
              Copy-Item -Path "dist/*" -Destination $targetDist -Recurse -Force
          } else {
              Write-Error "错误：未发现 dist 编译产物！"
              exit 1
          }
          
          # 复制 UI 产物
          if (Test-Path "ui/dist") { 
            $uiOut = New-Item -ItemType Directory -Force -Path "$out/ui/dist"
            Copy-Item -Path "ui/dist/*" -Destination $uiOut -Recurse -Force 
          }
          
          # 复制核心入口
          Copy-Item "openclaw.mjs" -Destination "$out/" -Force
          Copy-Item "package.json" -Destination "$out/" -Force
          
          # 复制 node.exe
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "$out/node.exe" -Force
          
          # 写入带婉儿提示的一键启动脚本
          $batContent = "@echo off`r`nchcp 65001 > nul`r`ntitle 婉儿助理 - 安全沙盒版`r`necho [婉儿温馨提示] 助理已上线，我会保护好你的电脑安全喔~`r`nnode.exe openclaw.mjs server start`r`npause"
          [System.IO.File]::WriteAllText("$out/双击我启动.bat", $batContent, [System.Text.Encoding]::UTF8)
          
          # 验证文件结构 (调试用)
          ls -R $out

      - name: 🎁 发布成品
        uses: actions/upload-artifact@v4
        with:
          name: 婉儿助理-绝对防御绿色版
          path: Waner-Assistant-Portable/
