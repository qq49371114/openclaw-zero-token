name: 🚀 龙虾打包机 - 一键生成免安装桌面版
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🛠️ 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安装依赖并编译
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
          pnpm ui:build

      - name: 🏗️ 制作绿色版全家桶
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "OpenClaw-Zero-Token"
          # 复制核心运行文件
          if (Test-Path "dist") { xcopy /E /I dist OpenClaw-Zero-Token\dist }
          if (Test-Path "ui/dist") { xcopy /E /I ui\dist OpenClaw-Zero-Token\ui\dist }
          copy openclaw.mjs OpenClaw-Zero-Token\
          copy package.json OpenClaw-Zero-Token\
          if (Test-Path ".openclaw-state.example") { xcopy /E /I .openclaw-state.example OpenClaw-Zero-Token\.openclaw-state.example }
          # 关键：获取 node 路径并复制
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "OpenClaw-Zero-Token
ode.exe"
          
      - name: 📝 写入一键启动脚本
        shell: pwsh
        run: |
          $script = @"
          @echo off
          title OpenClaw Zero Token - Portable
          echo 正在启动免 Token 小龙虾...
          .
ode.exe openclaw.mjs server start
          "@
          $script | Out-File -FilePath "OpenClaw-Zero-Token\双击我启动.bat" -Encoding ascii

      - name: 🎁 打包成压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path OpenClaw-Zero-Token -DestinationPath OpenClaw-Zero-Token-Windows-x64.zip

      - name: 📤 发布成品
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Zero-Token-绿色免安装版
          path: OpenClaw-Zero-Token-Windows-x64.zip
